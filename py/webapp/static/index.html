<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>iMBRACE AI Chat — Python</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-full bg-slate-50 text-slate-900">
  <div id="app" class="min-h-screen"></div>

<script>
const $ = (sel, el = document) => el.querySelector(sel)
const api = async (path, opts = {}) => {
  const res = await fetch(path, { headers: { "Content-Type": "application/json" }, ...opts })
  if (!res.ok) {
    let msg = `HTTP ${res.status}`
    try { msg = (await res.json()).detail || msg } catch {}
    // Session lost (server restarted / cookie stale) -> bounce back to login.
    if (res.status === 401) {
      state.orgs = []; state.agents = []; state.currentAgent = null; state.threads = {}
      renderLogin("Session ended — please sign in again.")
      throw new Error("Not logged in")
    }
    throw new Error(msg)
  }
  return res.status === 204 ? null : res.json()
}

const state = { orgs: [], orgName: "", agents: [], currentAgent: null, view: "chat", threads: {} }

// ── Screens ───────────────────────────────────────────────────────────────────
function renderLogin(err = "") {
  $("#app").innerHTML = `
    <div class="flex min-h-screen items-center justify-center px-4">
      <div class="w-full max-w-md rounded-2xl border border-slate-200 bg-white p-8 shadow-xl">
        <div class="mb-6 text-center">
          <div class="mx-auto mb-3 flex h-12 w-12 items-center justify-center rounded-2xl bg-blue-600 text-xl font-bold text-white">iB</div>
          <h1 class="text-2xl font-bold">iMBRACE AI <span class="text-blue-600">(Python)</span></h1>
          <p class="mt-1 text-sm text-slate-500">Sign in — powered by the Python SDK</p>
        </div>
        <input id="email" type="email" placeholder="you@company.com" class="mb-3 w-full rounded-xl border border-slate-300 px-3.5 py-2.5 text-sm outline-none focus:border-blue-500" />
        <input id="password" type="password" placeholder="••••••••" class="mb-3 w-full rounded-xl border border-slate-300 px-3.5 py-2.5 text-sm outline-none focus:border-blue-500" />
        <div id="err" class="mb-3 text-sm text-red-600">${err}</div>
        <button id="go" class="w-full rounded-xl bg-blue-600 py-2.5 text-sm font-semibold text-white hover:bg-blue-700">Sign in</button>
      </div>
    </div>`
  $("#go").onclick = async () => {
    $("#err").textContent = ""
    $("#go").textContent = "Signing in…"
    try {
      const r = await api("/api/login", { method: "POST", body: JSON.stringify({ email: $("#email").value, password: $("#password").value }) })
      state.orgs = r.organizations
      renderOrgs()
    } catch (e) { renderLogin(e.message); }
  }
}

function renderOrgs(err = "") {
  const rows = state.orgs.map(o => `<button data-id="${o.id}" data-name="${o.name}" class="org flex w-full items-center justify-between rounded-xl border border-slate-200 px-4 py-3 text-left hover:border-blue-400 hover:bg-blue-50"><span class="font-medium">${o.name}</span><span class="text-slate-400">→</span></button>`).join("")
  $("#app").innerHTML = `
    <div class="flex min-h-screen items-center justify-center px-4">
      <div class="w-full max-w-md rounded-2xl border border-slate-200 bg-white p-8 shadow-xl">
        <h1 class="text-2xl font-bold">Choose an organization</h1>
        <p class="mt-1 text-sm text-slate-500">${state.orgs.length} available</p>
        <input id="q" placeholder="Search…" class="my-3 w-full rounded-xl border border-slate-300 px-3.5 py-2.5 text-sm outline-none focus:border-blue-500" />
        <div id="err" class="mb-2 text-sm text-red-600">${err}</div>
        <div id="orgs" class="max-h-80 space-y-2 overflow-y-auto">${rows}</div>
      </div>
    </div>`
  const bind = () => $$("button.org").forEach(b => b.onclick = async () => {
    $("#err").textContent = "Selecting…"
    try {
      await api("/api/select-org", { method: "POST", body: JSON.stringify({ organization_id: b.dataset.id }) })
      state.orgName = b.dataset.name
      await loadAgents(); renderApp()
    } catch (e) {
      // Expired login token -> re-picking won't help; send back to login.
      if (/session expired|expired/i.test(e.message)) {
        renderLogin("Your login session expired. Please sign in again.")
      } else {
        renderOrgs(e.message)
      }
    }
  })
  const $$ = (s) => Array.from(document.querySelectorAll(s))
  $("#q").oninput = (e) => {
    const v = e.target.value.toLowerCase()
    $("#orgs").innerHTML = state.orgs.filter(o => o.name.toLowerCase().includes(v))
      .map(o => `<button data-id="${o.id}" data-name="${o.name}" class="org flex w-full items-center justify-between rounded-xl border border-slate-200 px-4 py-3 text-left hover:border-blue-400 hover:bg-blue-50"><span class="font-medium">${o.name}</span><span class="text-slate-400">→</span></button>`).join("")
    bind()
  }
  bind()
}

async function loadAgents() {
  state.agents = await api("/api/agents")
  state.currentAgent = state.agents.find(a => a.model_id) || state.agents[0] || null
}

// ── Main app shell ──────────────────────────────────────────────────────────────
function renderApp() {
  const nav = [["chat","💬 Chat"],["knowledge","📚 Knowledge Hub"],["workflows","⚙️ Workflows"],["boards","🗂️ Data Board"]]
  $("#app").innerHTML = `
    <div class="flex h-screen overflow-hidden">
      <aside class="flex w-56 shrink-0 flex-col border-r border-slate-200 bg-white">
        <div class="px-4 py-4">
          <div class="flex items-center gap-2"><span class="flex h-9 w-9 items-center justify-center rounded-xl bg-blue-600 text-sm font-bold text-white">iB</span><span class="font-semibold">iMBRACE · Py</span></div>
          <div class="mt-3 rounded-lg bg-slate-50 px-2.5 py-1.5"><p class="text-[10px] uppercase text-slate-400">Organization</p><p class="truncate text-sm font-semibold">${state.orgName}</p></div>
        </div>
        <nav class="flex-1 space-y-1 px-2">${nav.map(([k,l]) => `<button data-v="${k}" class="navbtn flex w-full items-center gap-2 rounded-xl px-3 py-2.5 text-sm font-medium ${state.view===k?'bg-blue-50 text-blue-700':'text-slate-600 hover:bg-slate-50'}">${l}</button>`).join("")}</nav>
        <div class="border-t border-slate-100 p-2"><button id="logout" class="w-full rounded-xl px-3 py-2.5 text-left text-sm text-slate-500 hover:bg-slate-50">↩ Sign out</button></div>
      </aside>
      <main id="main" class="flex-1 overflow-y-auto"></main>
    </div>`
  document.querySelectorAll(".navbtn").forEach(b => b.onclick = () => { state.view = b.dataset.v; renderApp() })
  $("#logout").onclick = async () => { await api("/api/logout", {method:"POST"}); location.reload() }
  if (state.view === "chat") renderChat()
  else if (state.view === "knowledge") renderKnowledge()
  else if (state.view === "workflows") renderWorkflows()
  else if (state.view === "boards") renderBoards()
}

// ── Chat (SSE streaming) ────────────────────────────────────────────────────────
function renderChat() {
  const a = state.currentAgent
  const opts = state.agents.map(x => `<option value="${x.id}" ${x.id===a?.id?'selected':''}>${x.name}${x.model_id?'':' (no model)'}</option>`).join("")
  const msgs = (state.threads[a?.id] || [])
  $("#main").innerHTML = `
    <div class="flex h-full flex-col">
      <header class="flex items-center justify-between gap-2 border-b border-slate-200 bg-white px-4 py-3">
        <select id="agentSel" class="rounded-xl border border-slate-200 px-3 py-2 text-sm font-medium">${opts}</select>
        <button id="kbBtn" class="rounded-xl border border-slate-200 px-3 py-2 text-sm font-medium hover:bg-blue-50">📚 Knowledge</button>
      </header>
      <div id="msgs" class="flex-1 overflow-y-auto px-4 py-6"><div class="mx-auto max-w-3xl space-y-4" id="msgList"></div></div>
      <div class="border-t border-slate-200 bg-white px-4 py-3">
        <form id="composer" class="mx-auto flex max-w-3xl items-end gap-2">
          <textarea id="input" rows="1" placeholder="${a?'Type a message…':'No agent'}" class="max-h-40 flex-1 resize-none rounded-xl border border-slate-300 px-3.5 py-2.5 text-sm outline-none focus:border-blue-500"></textarea>
          <button class="flex h-11 w-11 items-center justify-center rounded-xl bg-blue-600 text-white hover:bg-blue-700">➤</button>
        </form>
      </div>
    </div>`
  $("#agentSel").onchange = (e) => { state.currentAgent = state.agents.find(x => x.id === e.target.value); renderChat() }
  $("#kbBtn").onclick = () => openKnowledgeModal(a)
  paintMsgs()
  $("#composer").onsubmit = (e) => { e.preventDefault(); sendChat() }
}
function paintMsgs() {
  const a = state.currentAgent
  const msgs = state.threads[a?.id] || []
  $("#msgList").innerHTML = msgs.length ? msgs.map(m => `
    <div class="flex ${m.role==='user'?'justify-end':'justify-start'}">
      <div class="max-w-[80%] whitespace-pre-wrap rounded-2xl px-4 py-2.5 text-sm ${m.role==='user'?'bg-blue-600 text-white':'bg-white shadow ring-1 ring-slate-100'}">${escapeHtml(m.content)}${m.streaming?'<span class="ml-0.5 inline-block h-4 w-1.5 animate-pulse bg-current align-middle"></span>':''}</div>
    </div>`).join("") : `<div class="py-20 text-center text-slate-400">Ask anything — replies stream in real time.</div>`
  const c = $("#msgs"); if (c) c.scrollTop = c.scrollHeight
}
async function sendChat() {
  const a = state.currentAgent; if (!a) return
  const text = $("#input").value.trim(); if (!text) return
  state.threads[a.id] = state.threads[a.id] || []
  state.threads[a.id].push({ role: "user", content: text })
  const asst = { role: "assistant", content: "", streaming: true }
  state.threads[a.id].push(asst)
  $("#input").value = ""
  paintMsgs()
  const history = state.threads[a.id].filter(m => !m.streaming).map(m => ({ role: m.role, content: m.content }))
  try {
    const res = await fetch("/api/chat", { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify({ assistant_id: a.id, messages: history }) })
    const reader = res.body.getReader(); const dec = new TextDecoder(); let buf = ""
    while (true) {
      const { value, done } = await reader.read(); if (done) break
      buf += dec.decode(value, { stream: true })
      const lines = buf.split("\n"); buf = lines.pop()
      for (const line of lines) {
        if (!line.startsWith("data:")) continue
        const p = line.slice(5).trim()
        if (!p || p === "[DONE]") continue
        try { const ev = JSON.parse(p); if (ev.delta) { asst.content += ev.delta; paintMsgs() } else if (ev.error) { asst.content = "⚠️ " + ev.error; paintMsgs() } } catch {}
      }
    }
  } catch (e) { asst.content = "⚠️ " + e.message }
  asst.streaming = false; paintMsgs()
}

// ── Knowledge modal (attach folder to agent) ────────────────────────────────────
async function openKnowledgeModal(agent) {
  if (!agent) return
  const [folders, cur] = await Promise.all([api("/api/folders"), api(`/api/agents/${agent.id}/folders`)])
  const set = new Set(cur.folder_ids || [])
  const rows = folders.map(f => `<button data-id="${f.id}" class="kf flex w-full items-center gap-3 rounded-xl border px-4 py-3 text-left ${set.has(f.id)?'border-blue-400 bg-blue-50':'border-slate-200 hover:bg-slate-50'}"><span class="flex h-5 w-5 items-center justify-center rounded border ${set.has(f.id)?'border-blue-600 bg-blue-600 text-white':'border-slate-300'}">${set.has(f.id)?'✓':''}</span>📁 ${f.name}</button>`).join("")
  const m = document.createElement("div")
  m.className = "fixed inset-0 z-50 flex items-center justify-center bg-slate-900/40 px-4"
  m.innerHTML = `<div class="w-full max-w-lg rounded-2xl bg-white p-6 shadow-2xl"><h2 class="text-lg font-bold">Knowledge for “${agent.name}”</h2><p class="mt-1 text-sm text-slate-500">Tick a folder so this agent can answer from its files.</p><div id="kfList" class="mt-4 max-h-80 space-y-2 overflow-y-auto">${rows||'<p class="text-sm text-slate-500">No folders.</p>'}</div><div class="mt-4 text-right"><button id="kfDone" class="rounded-xl bg-blue-600 px-4 py-2 text-sm font-semibold text-white">Done</button></div></div>`
  m.onclick = (e) => { if (e.target === m) m.remove() }
  document.body.appendChild(m)
  $("#kfDone", m).onclick = () => m.remove()
  m.querySelectorAll(".kf").forEach(b => b.onclick = async () => {
    const id = b.dataset.id; const attach = !set.has(id)
    b.style.opacity = .5
    try { const r = await api(`/api/agents/${agent.id}/folders`, { method:"POST", body: JSON.stringify({ folder_id: id, attached: attach }) })
      const ns = new Set(r.folder_ids || []); openKnowledgeModalRefresh(m, agent, ns, await api("/api/folders")) } catch(e){ alert(e.message) }
    b.style.opacity = 1
  })
}
function openKnowledgeModalRefresh(m, agent, set, folders) {
  $("#kfList", m).innerHTML = folders.map(f => `<button data-id="${f.id}" class="kf flex w-full items-center gap-3 rounded-xl border px-4 py-3 text-left ${set.has(f.id)?'border-blue-400 bg-blue-50':'border-slate-200 hover:bg-slate-50'}"><span class="flex h-5 w-5 items-center justify-center rounded border ${set.has(f.id)?'border-blue-600 bg-blue-600 text-white':'border-slate-300'}">${set.has(f.id)?'✓':''}</span>📁 ${f.name}</button>`).join("")
  m.querySelectorAll(".kf").forEach(b => b.onclick = async () => {
    const id = b.dataset.id; const attach = !set.has(id)
    try { const r = await api(`/api/agents/${agent.id}/folders`, { method:"POST", body: JSON.stringify({ folder_id: id, attached: attach }) })
      openKnowledgeModalRefresh(m, agent, new Set(r.folder_ids||[]), folders) } catch(e){ alert(e.message) }
  })
}

// ── Knowledge Hub tab ───────────────────────────────────────────────────────────
async function renderKnowledge() {
  $("#main").innerHTML = `<div class="mx-auto max-w-4xl p-6"><div class="mb-4 flex items-center justify-between"><h1 class="text-xl font-bold">Knowledge Hub</h1><div class="flex gap-2"><input id="nf" placeholder="New folder name" class="rounded-lg border border-slate-300 px-3 py-2 text-sm"/><button id="addF" class="rounded-xl bg-blue-600 px-4 py-2 text-sm font-semibold text-white">+ Folder</button></div></div><div id="kh">Loading…</div></div>`
  $("#addF").onclick = async () => { const n = $("#nf").value.trim(); if(!n) return; try { await api("/api/folders",{method:"POST",body:JSON.stringify({name:n})}); $("#nf").value=""; loadKH() } catch(e){alert(e.message)} }
  loadKH()
}
async function loadKH() {
  const folders = await api("/api/folders")
  $("#kh").innerHTML = folders.length ? `<div class="grid gap-3 sm:grid-cols-2">${folders.map(f=>`<button data-id="${f.id}" data-name="${f.name}" class="khf rounded-xl border border-slate-200 bg-white p-4 text-left hover:border-blue-400 hover:bg-blue-50">📁 <span class="font-semibold">${f.name}</span></button>`).join("")}</div>` : `<p class="text-slate-500">No folders yet.</p>`
  document.querySelectorAll(".khf").forEach(b => b.onclick = () => openFolder(b.dataset.id, b.dataset.name))
}
async function openFolder(id, name) {
  $("#main").innerHTML = `<div class="mx-auto max-w-4xl p-6"><button id="back" class="mb-3 text-sm text-slate-500 hover:underline">← Back</button><div class="mb-4 flex items-center justify-between"><h1 class="text-xl font-bold">${name}</h1><label class="cursor-pointer rounded-xl bg-blue-600 px-4 py-2 text-sm font-semibold text-white">↑ Upload<input id="up" type="file" class="hidden"/></label></div><div id="files">Loading…</div></div>`
  $("#back").onclick = () => renderKnowledge()
  $("#up").onchange = async (e) => { const f = e.target.files[0]; if(!f) return; const fd = new FormData(); fd.append("file", f); try { await fetch(`/api/folders/${id}/upload`,{method:"POST",body:fd}).then(r=>{if(!r.ok)throw new Error("upload failed")}); loadFiles(id) } catch(err){alert(err.message)} }
  loadFiles(id)
}
async function loadFiles(id) {
  const files = await api(`/api/folders/${id}/files`)
  $("#files").innerHTML = files.length ? `<ul class="divide-y divide-slate-100 rounded-xl border border-slate-200 bg-white">${files.map(f=>`<li class="flex items-center gap-3 px-4 py-3">📄 <span class="text-sm font-medium">${f.name}</span><span class="text-xs text-slate-400">${f.fileType||''}</span></li>`).join("")}</ul>` : `<p class="text-slate-500">No files. Upload one above.</p>`
}

// ── Workflows tab ───────────────────────────────────────────────────────────────
async function renderWorkflows() {
  $("#main").innerHTML = `<div class="mx-auto max-w-4xl p-6"><div class="mb-4 flex items-center justify-between"><h1 class="text-xl font-bold">Workflows</h1><div class="flex gap-2"><input id="nwf" placeholder="New flow name" class="rounded-lg border border-slate-300 px-3 py-2 text-sm"/><button id="addWf" class="rounded-xl bg-blue-600 px-4 py-2 text-sm font-semibold text-white">+ Flow</button></div></div><h2 class="mb-2 text-sm font-semibold uppercase text-slate-500">Flows</h2><div id="flows">Loading…</div><h2 class="mb-2 mt-6 text-sm font-semibold uppercase text-slate-500">Recent runs <button id="rf" class="text-xs text-blue-600">refresh</button></h2><div id="runs">Loading…</div></div>`
  $("#addWf").onclick = async () => { const n=$("#nwf").value.trim(); if(!n)return; try{await api("/api/flows",{method:"POST",body:JSON.stringify({display_name:n})}); $("#nwf").value=""; loadFlows()}catch(e){alert(e.message)} }
  $("#rf").onclick = loadRuns
  loadFlows(); loadRuns()
}
async function loadFlows() {
  const flows = await api("/api/flows")
  $("#flows").innerHTML = flows.length ? `<ul class="space-y-2">${flows.map(f=>`<li class="flex items-center justify-between rounded-xl border border-slate-200 bg-white px-4 py-3"><span class="font-medium">${f.name}</span><span class="flex items-center gap-2"><span class="rounded-full px-2 py-0.5 text-xs ${/ENABLE/i.test(f.status)?'bg-green-100 text-green-700':'bg-slate-100 text-slate-600'}">${f.status||'—'}</span><button data-id="${f.id}" class="trg rounded-lg border border-slate-200 px-3 py-1.5 text-xs font-semibold hover:bg-blue-50">▶ Trigger</button></span></li>`).join("")}</ul>` : `<p class="text-slate-500">No flows.</p>`
  document.querySelectorAll(".trg").forEach(b=>b.onclick=async()=>{b.textContent="…";try{await api(`/api/flows/${b.dataset.id}/trigger`,{method:"POST"}); b.textContent="✓ Triggered"; setTimeout(loadRuns,4000)}catch(e){alert(e.message);b.textContent="▶ Trigger"}})
}
async function loadRuns() {
  const runs = await api("/api/runs")
  $("#runs").innerHTML = runs.length ? `<ul class="space-y-2">${runs.slice(0,20).map(r=>`<li class="flex items-center justify-between rounded-xl border border-slate-200 bg-white px-4 py-3"><span class="font-mono text-xs text-slate-500">${r.id}</span><span class="rounded-full px-2 py-0.5 text-xs ${/SUCCEED/i.test(r.status)?'bg-green-100 text-green-700':/FAIL/i.test(r.status)?'bg-red-100 text-red-700':'bg-amber-100 text-amber-700'}">${r.status}</span></li>`).join("")}</ul>` : `<p class="text-slate-500">No runs.</p>`
}

// ── Data Board tab ──────────────────────────────────────────────────────────────
async function renderBoards() {
  $("#main").innerHTML = `<div class="mx-auto max-w-4xl p-6"><h1 class="mb-4 text-xl font-bold">Data Board</h1><div id="bd">Loading…</div></div>`
  const boards = await api("/api/boards")
  $("#bd").innerHTML = boards.length ? `<div class="grid gap-3 sm:grid-cols-2">${boards.map(b=>`<div class="rounded-xl border border-slate-200 bg-white p-4"><span class="font-semibold">${b.name}</span> ${b.type?`<span class="rounded-full bg-slate-100 px-2 py-0.5 text-xs text-slate-500">${b.type}</span>`:''}${b.description?`<p class="mt-1 text-sm text-slate-500">${b.description}</p>`:''}</div>`).join("")}</div>` : `<p class="text-slate-500">No boards.</p>`
}

function escapeHtml(s){return s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}

renderLogin()
</script>
</body>
</html>
